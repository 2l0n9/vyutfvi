<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính diện tích HCN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"> 
</head>
<body>
    <div class="container calculator-card">
        <h1>Tính diện tích HCN</h1>
        <div class="form-group">
            <label for="length">Chiều dài:</label>
            <input type="number" min="0" id="length" class="form-control">
        </div>
        <div class="form-group">
            <label for="width">Chiều rộng:</label>
            <input type="number" min="0" id="width" class="form-control">
        </div>
        <button id="calculateBtn" class="btn btn-calculate">Tính diện tích</button>
        <div id="result">Kết quả: </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
