<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính diện tích HCN</title>
</head>
<body>
    <div class="container">
        <h1>Tính diện tích HCN</h1>
        <div>
            <label for="length">Chiều dài:</label>
            <input type="number" min="0" id="length">
        </div>
        <div>
            <label for="width">Chiều rộng:</label>
            <input type="number" min="0" id="width">
        </div>
        <button onclick="cal()">Tính diện tích</button>
        <div id="result">Kết quả: </div>
    </div>
    <script>
        function cal() {
            const chieudai = document.getElementById('length').value;
            const chieurong = document.getElementById('width').value;
            const dientich = chieudai*chieurong
            document.getElementById('result').textContent = "Diện tích HCN là " + dientich.toFixed(2)
        }
    </script>
</body>
